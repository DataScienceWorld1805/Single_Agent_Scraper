services:
  scraper:
    build: .
    image: single-agent-scraper:latest
    env_file:
      - .env
    environment:
      OUTPUT_DIR: /app/output
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
    shm_size: "1gb"
    # Interfaz: http://localhost:8000
    # CLI: docker compose run --rm --entrypoint python scraper -m scraper_agent.cli scrape "URL" -i --no-open
    restart: unless-stopped
